<div class="userNameHolder" *ngIf="userLoggedIn === 'true'">
  Username: {{ formatObject(queryParams.username) }}<br>
  Role: {{ formatObject(queryParams.role) }}
</div>
<nav>
  <input type="checkbox" id="check">
  <label for="check" class="checkbtn">
    <i class="fas fa-bars"></i>
  </label>
<label class="logo"><img src="https://getdrawings.com/vectors/badminton-vector-7.png" class="logo-image"></label>
<ul>
  <li><a (click)="homeClicked()" routerLink="/" >Home</a></li>
  <li><a (click)="tournamentsClicked()" routerLink="Tournaments-component" >Tournaments</a></li>
  <li><a (click)="coursesClicked()" routerLink="/Courses-component" >Courses</a></li>
  <li><a  routerLink="/Login-component" routerLinkActive="active" *ngIf="userLoggedIn === 'false'">Login</a></li>
  <li><a (click)="logoutClicked()"  routerLink="/Logout-component" *ngIf="userLoggedIn === 'true'">Log-out</a></li>
</ul>
</nav>
<router-outlet></router-outlet>
