<div class="alert alert-success" id="successfullyCreatedMessage" role="alert" *ngIf="successfullyCreatedMessage.length !==0">{{successfullyCreatedMessage}}</div>
<div class="alert alert-danger" id="usernameExistanceMessage" role="alert" *ngIf="usernameExistanceMessage.length !== 0">{{usernameExistanceMessage}}</div>
<div class="container" id="FormContainer">
    <h3>Registration</h3>
<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="form-group" >
        <label for="InputFirstName">FirstName</label>
        <input type="text" class="form-control" id="InputFirstName" placeholder="FirstName" formControlName="firstName" required>
    </div>
    <div class="form-group">
        <label for="InputLastName">LastName</label>
        <input type="text" class="form-control" id="InputLastName"  placeholder="LastName" formControlName="lastName" required>
    </div>
    <div class="form-group">
        <label for="InputUsername">Username</label>
        <input type="text" class="form-control" id="InputUsername"  placeholder="Username" formControlName="username" required>
    </div>
    <div class="form-group">
        <label for="InputEmail">Email Address</label>
        <input type="email" class="form-control" id="InputEmail" aria-describedby="emailHelp" placeholder="Email" formControlName="email" required>
        <small id="emailHelp" class="form-text text-muted">Your email will not delivered to anyone else.</small>
    </div>
    <div class="from-group">
        <label for="InputPassword">Password</label>
        <input type="" class="form-control" id="InputPassword" placeholder="Password" formControlName="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Reqistration</button>
    <a href="/Login-component" class="btn btn-primary">Login</a>
</form>
</div>
